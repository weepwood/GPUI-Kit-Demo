[package]
name = "gpui-kit-demo"
version = "0.1.0"
edition = "2024"
description = "Reusable native desktop UI starter built with GPUI Kit"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "=0.9.0"

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
